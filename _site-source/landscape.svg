<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" fill="none" role="img" aria-labelledby="landscape-title landscape-desc">
  <title id="landscape-title">A small landscape to explore</title>
  <desc id="landscape-desc">A winding river connects a person writing in an open notebook, four people gathered around a shared table beneath a tree, and a policy-research workshop with a solar roof and a chart in its window. Choose About me, Migunani, or Research and tools.</desc>
  <style>
    .line{stroke:#333b63;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
    .fine{stroke-width:1.3}
    .paper{fill:#f7f7f2}
    .sage{fill:#dde3d5}
    .clay{stroke:#b85e45}
    .destination{cursor:pointer;outline:none}
    .wash{fill:#dde3d5;fill-opacity:0;transition:fill-opacity .18s ease}
    .destination:hover .wash,.destination:focus .wash{fill-opacity:.7}
    .focus-ring{stroke:#b85e45;stroke-width:1.6;stroke-dasharray:3 5;opacity:0}
    .destination:focus .focus-ring,.destination:focus-visible .focus-ring{opacity:1}
    .label{fill:#333b63;font-family:Georgia,'Times New Roman',serif;font-size:18px;letter-spacing:.15px}
    .arrow{stroke:#b85e45;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
    @media(max-width:620px){.label,.arrow{display:none}}
    @media(prefers-reduced-motion:reduce){.wash{transition:none}}
  </style>

  <!-- The river is the shared ground, not a fourth destination. -->
