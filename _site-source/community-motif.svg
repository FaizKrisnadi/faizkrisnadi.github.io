<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 210" fill="none" role="img" aria-labelledby="community-title community-desc">
  <title id="community-title">Growing through care</title>
  <desc id="community-desc">Three people join hands in a shallow arc around a young, rooted plant. When played, the connected figures and the plant gently sway twice, then settle.</desc>
  <style>
    .ink{stroke:#333b63;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
    .fine{stroke-width:1.2}
    .paper{fill:#f7f7f2}
    .sage{fill:#dde3d5}
    .clay{stroke:#a74d38}
    .group,.plant{transform-box:fill-box;transform-origin:50% 100%}
    svg.play .group{animation:together 4s ease-in-out both}
    svg.play .plant{animation:grow-with 4s ease-in-out both}
    @keyframes together{0%,50%,100%{transform:rotate(0)}15%,65%{transform:rotate(-1.4deg)}35%,85%{transform:rotate(1.4deg)}}
    @keyframes grow-with{0%,50%,100%{transform:rotate(0)}20%,70%{transform:rotate(3deg)}40%,90%{transform:rotate(-2.5deg)}}
    @media(prefers-reduced-motion:reduce){svg.play .group,svg.play .plant{animation:none}}
  </style>

  <g class="ink fine" opacity=".5" aria-hidden="true">
    <path d="M39 185q35-7 65-2m91 0q30-5 64 2m-144 9q35 4 68-1"/>
    <path d="m50 181 1-8m0 4-4-4m5 2 4-5m183 9 2-8m-2 4-3-4"/>
  </g>

  <g class="group ink" aria-hidden="true">
    <!-- The middle figure holds the shared connection rather than a symbol. -->
    <path d="M138 58c-1-10 4-17 13-17 10 0 16 7 15 17-1 10-7 17-14 17-8 0-14-7-14-17Z" class="paper"/>
    <path d="M138 53q-2-15 12-17 16-1 17 18l-10-6-8 4-11 1m5 8h5m7 0h5m-12 0h7m-5 9 5-1" class="fine"/>
    <path d="m143 77-11 8-7 35 13 5 3-23-3 38h29l-5-39 8 23 12-5-13-34-11-8" class="sage"/>
    <path d="m148 77 5 8 5-8m-5 8v19m-16 36-3 38h13l7-36 8 36h13l-8-38m-33 38-4 6h17m15-6v6h18"/>
    <!-- Left: a short-haired person in rolled sleeves, reaching in. -->
    <path d="M65 83c-2-9 3-17 12-18 11-1 17 6 17 16 0 10-5 17-13 18-8 1-15-6-16-16Z" class="paper"/>
    <path d="M65 81q-5-13 4-19 13-8 22 2l3 13-10-7-12 5m1 9h1m11-1h1m-9 10 5-1" class="fine"/>
    <path d="m72 101-12 10-2 26 12 2 3-22-2 31h28l-4-30 13 14 13-3-2-9-9 2-15-17-10-6" class="paper"/>
    <path d="m73 102 7 7 7-9m-27 30 11 2m29-9 7-6m-47 20-1 8 7 1 4-7m1 10-4 31h12l8-29 5 30h13l-6-32m-32 31-5 5h17m13-5v5h18"/>
    <!-- Right: a person with tied-back hair and a long, easy overshirt. -->
    <path d="M207 80c-1-9 4-16 13-16 10 0 16 7 15 16 0 10-6 17-13 17-8 0-14-7-15-17Z" class="paper"/>
    <path d="M208 78q-4-16 10-19 13-2 17 11 10-1 10 7-1 8-10 7m-27-8q11 1 16-9l10 11m-21 5h1m10 0h1m-10 9 5 1" class="fine"/>
    <path d="m214 100-13 6-14 17-9-3-2 9 14 4 14-14-6 32h35l-4-35 3 21 11-2-3-27-13-9" class="paper"/>
    <path d="m215 100 6 9 6-10m-6 10v33m-23-22-7-6m40 15 11-2m-10 10 3 9 7-2-1-9m-39 17-1 29h13l6-28 4 28h13l-5-29m-30 29-4 5h18m8-5v5h18"/>
    <!-- Small joined hands make the gestures explicit. -->
    <path d="m119 120 5-4 6 3-1 6-7 4-3-3m57-6-5-3-5 4 3 5 7 3 3-3" class="paper clay"/>
  </g>

  <g class="plant ink" aria-hidden="true">
    <path d="M151 185v-35m0 17-11-9m11 3 11-13"/>
    <path d="M140 158q-16 1-18-14 15-2 18 14Zm21-9q0-16 16-18 1 16-16 18Z" class="sage"/>
    <path d="M150 151q-9-9-2-20 11 8 2 20Z" class="paper"/>
    <path d="m151 185-9 7m9-6 7 7m-7-5v10m-7-8-7 1m20 0 8 1" class="fine clay"/>
    <path d="M133 184q17-5 36 0" class="fine"/>
  </g>
</svg>
